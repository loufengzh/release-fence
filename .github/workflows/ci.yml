name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
        include:
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare build tooling
        run: python -m pip install 'setuptools>=77' wheel
      - name: Build wheel
        run: python -m pip wheel --no-deps --no-build-isolation . -w dist
      - name: Verify clean installed wheel
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys
          wheels = list(Path('dist').glob('*.whl'))
          assert len(wheels) == 1, wheels
          subprocess.run([sys.executable, '.github/scripts/check_install.py', str(wheels[0])], check=True)
