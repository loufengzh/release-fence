name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'setuptools>=77' wheel
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: python -m pip wheel --no-deps --no-build-isolation . -w dist
      - run: |
          python -m venv /tmp/release-fence-smoke
          /tmp/release-fence-smoke/bin/python -m pip install --no-deps dist/*.whl
          python examples/make_demo.py
          /tmp/release-fence-smoke/bin/release-fence check examples/demo.zip --policy examples/policy.json
          /tmp/release-fence-smoke/bin/release-fence scan examples/demo.zip > /tmp/inventory.json
          /tmp/release-fence-smoke/bin/release-fence diff /tmp/inventory.json /tmp/inventory.json
