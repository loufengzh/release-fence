[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "release-fence"
version = "0.1.0"
description = "Deterministic ZIP release inventories and explicit packaging policy gates"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["release", "zip", "inventory", "ci"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.scripts]
release-fence = "release_fence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
